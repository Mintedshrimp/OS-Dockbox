name: OS Dockbox CI/CD

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Test Android App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Create .env dummy for build
        run: |
          touch .env
          echo "GEMINI_API_KEY=test_key" >> .env

      - name: Run Unit & Robolectric Tests
        run: ./gradlew testDebugUnitTest --stacktrace || gradle testDebugUnitTest --stacktrace

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace || gradle assembleDebug --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OS-Dockbox-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
