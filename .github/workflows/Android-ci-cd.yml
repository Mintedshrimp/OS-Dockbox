# Android CI/CD: build, sign, auto version-bump, changelog summary & release
# Triggers: push to main and manual workflow_dispatch
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  packages: write

name: Android CI/CD - build, sign, auto-bump & release

env:
  KEYSTORE_FILE: release-keystore.jks

jobs:
  build_release:
    name: Build, sign, auto-version-bump & create release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/gradle-wrapper.properties') }}-${{ hashFiles('**/*.gradle*','**/*.gradle.kts') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Decode organization keystore (from base64 secret)
        if: ${{ secrets.ORG_KEYSTORE_BASE64 != '' }}
        run: |
          set -e
          echo "Decoding keystore to $KEYSTORE_FILE"
          echo "${{ secrets.ORG_KEYSTORE_BASE64 }}" | base64 --decode > "$KEYSTORE_FILE"
          ls -l "$KEYSTORE_FILE"

      - name: Build Release APK (signed via Gradle injected signing properties)
        run: |
          set -e
          echo "Running Gradle assembleRelease with injected signing properties"
          ./gradlew clean :app:assembleRelease \
            -Pandroid.injected.signing.store.file="${{ env.KEYSTORE_FILE }}" \
            -Pandroid.injected.signing.store.password="${{ secrets.ORG_KEYSTORE_PASSWORD }}" \
            -Pandroid.injected.signing.key.alias="${{ secrets.ORG_KEY_ALIAS }}" \
            -Pandroid.injected.signing.key.password="${{ secrets.ORG_KEY_PASSWORD }}" \
            --no-daemon --stacktrace

      - name: Locate the built APK
        id: locate_apk
        run: |
          set -e
          POSSIBLE=("app/build/outputs/apk/release/app-release.apk" "app/build/outputs/apk/release/app-release-unsigned.apk" "app/build/outputs/apk/release/app-release-unsigned-aligned.apk")
          for p in "${POSSIBLE[@]}"; do
            if [ -f "$p" ]; then
              echo "apk_path=$p" >> $GITHUB_OUTPUT
              echo "Found APK: $p"
              exit 0
            fi
          done
          echo "No APK found in default locations." >&2
          ls -R app/build/outputs || true
          exit 1

      - name: Verify signature (apksigner)
        if: ${{ steps.locate_apk.outputs.apk_path != '' }}
        run: |
          set -e
          if ! command -v apksigner >/dev/null 2>&1; then
            echo "apksigner not found; installing Android SDK build-tools"
            sudo apt-get update
            sudo apt-get install -y zip unzip
            yes | sdkmanager --install "build-tools;33.0.0"
          fi
          apksigner verify --print-certs "${{ steps.locate_apk.outputs.apk_path }}" || true

      - name: Determine new version tag and build changelog
        id: create_tag
        run: |
          set -e
          # Find latest tag that matches v<major>.<minor(1digit)>.<patch(1digit)>
          LATEST_TAG=$(git tag --list 'v*.*.*' | grep -E '^v[0-9]+\.[0-9]\.[0-9]$' | sort -V | tail -n1 || true)
          echo "Latest tag: $LATEST_TAG"

          if [[ "$LATEST_TAG" =~ ^v([0-9]+)\.([0-9])\.([0-9])$ ]]; then
            MAJOR=${BASH_REMATCH[1]}
            MINOR=${BASH_REMATCH[2]}
            PATCH=${BASH_REMATCH[3]}
          else
            MAJOR=0
            MINOR=0
            PATCH=0
          fi

          # Bump patch with rollover rules so minor/patch remain single digits (0-9)
          PATCH=$((PATCH + 1))
          if [ "$PATCH" -gt 9 ]; then
            PATCH=0
            MINOR=$((MINOR + 1))
          fi
          if [ "$MINOR" -gt 9 ]; then
            MINOR=0
            MAJOR=$((MAJOR + 1))
          fi

          NEW_TAG="v${MAJOR}.${MINOR}.${PATCH}"
          echo "New tag will be: $NEW_TAG"

          # Build changelog from commits since latest tag (or all history if no tag)
          if [ -n "$LATEST_TAG" ]; then
            CHANGELOG=$(git --no-pager log --pretty=format:"- %s (%h)" ${LATEST_TAG}..HEAD)
          else
            CHANGELOG=$(git --no-pager log --pretty=format:"- %s (%h)" HEAD)
          fi

          if [ -z "$CHANGELOG" ]; then
            CHANGELOG="No changes recorded in commits."
          fi

          # Create annotated tag with changelog as message
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$NEW_TAG" -m "$CHANGELOG"

          # Push tag to origin (actions/checkout configured with credentials)
          git push origin "$NEW_TAG"

          # Export outputs for later steps
          echo "tag=$NEW_TAG" >> $GITHUB_OUTPUT
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create GitHub Release and upload APK
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ steps.create_tag.outputs.tag }}
          name: ${{ steps.create_tag.outputs.tag }}
          body: ${{ steps.create_tag.outputs.changelog }}
          files: ${{ steps.locate_apk.outputs.apk_path }}

      - name: Upload APK as workflow artifact (debug / fallback)
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: ${{ steps.locate_apk.outputs.apk_path }}

  publish_to_play:
    name: Optional: publish to Google Play (if secret provided)
    runs-on: ubuntu-latest
    needs: build_release
    if: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON != '' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download APK from previous job artifact
        uses: actions/download-artifact@v4
        with:
          name: app-release-apk
          path: ./output

      - name: Publish to Google Play (r0adkll/upload-google-play)
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}
          packageName: com.example.yourapp  # <- change this to your package name
          releaseFile: ./output/app-release-apk/app-release.apk
          track: production
